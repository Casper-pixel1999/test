<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050510" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Неоновые врата — Neon Gates</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game" aria-label="Neon Gates"></canvas>
    <div id="ui" class="ui">
      <!-- MENU -->
      <div id="screen-menu" class="screen active">
        <div class="logo-block">
          <div class="logo-glow"></div>
          <h1 id="title-main" class="title neon-text">Неоновые врата</h1>
          <p id="title-sub" class="subtitle">Neon Gates</p>
        </div>
        <div class="menu-stats">
          <span id="lbl-best">Рекорд</span>: <strong id="val-best">0</strong>
        </div>
        <button type="button" id="btn-play" class="btn btn-primary cta">Играть</button>
        <button type="button" id="btn-how" class="btn btn-secondary">Как играть</button>
        <button type="button" id="btn-sound" class="btn btn-icon" aria-pressed="true">🔊</button>
      </div>

      <!-- HOW TO PLAY -->
      <div id="screen-how" class="screen">
        <h2 id="how-title" class="panel-title">Как играть</h2>
        <ul id="how-list" class="how-list"></ul>
        <button type="button" id="btn-how-back" class="btn btn-primary">Назад</button>
      </div>

      <!-- HUD -->
      <div id="screen-hud" class="screen hud">
        <div class="hud-top">
          <div class="hud-score"><span id="lbl-score">Очки</span> <strong id="val-score">0</strong></div>
          <div class="hud-combo" id="combo-wrap"><span id="lbl-combo">Комбо</span> ×<strong id="val-combo">1</strong></div>
        </div>
        <div class="touch-zones" id="touch-zones" aria-hidden="true">
          <div class="zone zone-left" id="zone-left"></div>
          <div class="zone zone-right" id="zone-right"></div>
        </div>
        <button type="button" id="btn-pause" class="btn btn-icon hud-pause">⏸</button>
      </div>

      <!-- PAUSE -->
      <div id="screen-pause" class="screen">
        <h2 id="pause-title" class="panel-title">Пауза</h2>
        <button type="button" id="btn-resume" class="btn btn-primary cta">Продолжить</button>
        <button type="button" id="btn-pause-menu" class="btn btn-secondary">В меню</button>
        <button type="button" id="btn-pause-sound" class="btn btn-icon">🔊</button>
      </div>

      <!-- GAME OVER -->
      <div id="screen-gameover" class="screen">
        <h2 id="go-title" class="panel-title neon-text danger">Игра окончена</h2>
        <div class="go-stats">
          <div><span id="lbl-go-score">Очки</span>: <strong id="val-go-score">0</strong></div>
          <div><span id="lbl-go-best">Рекорд</span>: <strong id="val-go-best">0</strong></div>
        </div>
        <button type="button" id="btn-continue" class="btn btn-reward cta hidden">▶ Продолжить (реклама)</button>
        <button type="button" id="btn-double" class="btn btn-reward hidden">×2 очки (реклама)</button>
        <button type="button" id="btn-restart" class="btn btn-primary cta">Заново</button>
        <button type="button" id="btn-go-menu" class="btn btn-secondary">В меню</button>
      </div>

      <!-- AD OVERLAY -->
      <div id="screen-ad" class="screen ad-overlay">
        <p id="ad-label">Реклама…</p>
      </div>
    </div>
  </div>

  <script src="/sdk.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/saves.js"></script>
  <script src="js/sdk-bridge.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
